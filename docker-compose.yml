version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: saas_poc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/saas_poc
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aia-backend.entrypoints=websecure"
      - "traefik.http.routers.aia-backend.rule=Host(`aia.srv1575169.hstgr.cloud`)"
      - "traefik.http.routers.aia-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.aia-backend.loadbalancer.server.port=8080"

volumes:
  pgdata:
