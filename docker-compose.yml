version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: saas_poc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/saas_poc
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aia-backend.entrypoints=websecure"
      - "traefik.http.routers.aia-backend.rule=Host(`aia-api.srv1575169.hstgr.cloud`)"
      - "traefik.http.routers.aia-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.aia-backend.loadbalancer.server.port=8081"

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL:-https://dashboard.srv1575169.hstgr.cloud}
    ports:
      - "3001:3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aia-website.entrypoints=websecure"
      - "traefik.http.routers.aia-website.rule=Host(`aia.srv1575169.hstgr.cloud`)"
      - "traefik.http.routers.aia-website.tls.certresolver=letsencrypt"
      - "traefik.http.services.aia-website.loadbalancer.server.port=3001"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://aia-api.srv1575169.hstgr.cloud}
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aia-dashboard.entrypoints=websecure"
      - "traefik.http.routers.aia-dashboard.rule=Host(`dashboard.srv1575169.hstgr.cloud`)"
      - "traefik.http.routers.aia-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.aia-dashboard.loadbalancer.server.port=3000"

volumes:
  pgdata:
